# Publish only the public static website to the gh-pages branch.
# The PHP API is deployed through cPanel, not GitHub Pages.
name: Publish site to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate PHP API syntax
        run: |
          php -l api/save-inquiry.php
          php -l api/visitor-stats.php
      - name: Validate site structure
        run: node tests/validate-site.js
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html _site/
          mkdir -p _site/image
          cp -R image/optimized _site/image/
          find image -maxdepth 1 -type f ! -name '*.jpg' -exec cp {} _site/image/ \;
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
